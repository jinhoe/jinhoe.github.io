---
layout: default
body_class: page-post
---
<article class="entry">
    <header class="entry-header">
        <time class="entry-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        <h1 class="entry-title">{{ page.title }}</h1>
    </header>
    <div class="content">{{ content }}</div>
</article>
{% include archive.html current_post=page %}
